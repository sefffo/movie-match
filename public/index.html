<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Match</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 { font-size: 2rem; margin: 0; }
    p  { color: #9aa5c4; margin: 0; }
    .badge {
      margin-top: 16px;
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      font-size: 0.85rem;
      color: #9aa5c4;
    }
    .badge span { color: #e94560; font-weight: 700; }
  </style>
</head>
<body>
  <h1>🎬 Movie Match</h1>
  <p>What are we watching tonight?</p>
  <div class="badge">Stage <span>1</span> — Server is live ✅</div>
</body>
</html>
